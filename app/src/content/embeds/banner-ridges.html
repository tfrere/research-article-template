<div role="img" aria-label="Ridgeline portrait of this article: one ridge per section, in reading order, tracing how long its words are. Prose peaks on short words, code and components push bumps toward long identifiers." class="banner-ridges">
  <canvas class="banner-ridges__canvas" aria-hidden="true"></canvas>
  <span class="banner-ridges__caption"></span>
</div>
<style>
  .banner-ridges {
    position: relative;
    width: 100%;
    aspect-ratio: 12 / 5;
    min-height: 180px;
  }
  .hero-banner .banner-ridges {
    position: absolute;
    inset: 0;
    aspect-ratio: auto;
    min-height: 0;
  }
  .banner-ridges__canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .banner-ridges__caption {
    position: absolute;
    right: 12px;
    bottom: 8px;
    font: 500 10px/1.2 var(--font-mono, ui-monospace, monospace);
    letter-spacing: .02em;
    color: var(--muted-color);
    opacity: .75;
    pointer-events: none;
    white-space: nowrap;
  }
  @media print {
    .banner-ridges__caption { display: none; }
  }
</style>
<script>
  (() => {
    const ROOT = 'banner-ridges';
    const DATA_FILE = 'article-anatomy.json';
    const MIN_SECTION_WORDS = 40;
    const MAX_LEN = 24; // word lengths are clamped to 1..24 letters
    const SAMPLES = 180;
    const BANDWIDTH = 0.05; // in log10(length) units
    const MS_PER_WORD = 7;

    const ensureD3 = (cb) => {
      if (window.d3 && typeof window.d3.select === 'function') return cb();
      let s = document.getElementById('d3-cdn-script');
      if (!s) {
        s = document.createElement('script');
        s.id = 'd3-cdn-script';
        s.src = 'https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js';
        document.head.appendChild(s);
      }
      const onReady = () => { if (window.d3 && typeof window.d3.select === 'function') cb(); };
      s.addEventListener('load', onReady, { once: true });
      if (window.d3) onReady();
    };

    const fetchFirstAvailable = async (paths) => {
      for (const p of paths) {
        try {
          const r = await fetch(p, { cache: 'force-cache' });
          if (r.ok) return r.json();
        } catch (_) {}
      }
      throw new Error(`${DATA_FILE} not found`);
    };

    const mount = (root) => {
      root.dataset.mounted = 'true';
      const canvas = root.querySelector('canvas');
      const caption = root.querySelector(`.${ROOT}__caption`);
      const ctx = canvas.getContext('2d');
      const reduceMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

      let data = null;
      let theme = null;
      let model = null;
      let layer = null;
      let W = 0, H = 0, dpr = 1;
      let visible = true;
      let raf = 0, last = 0, clock = 9000;

      const readTheme = () => {
        const host = root.closest('[data-theme]') || document.documentElement;
        const dark = host.getAttribute('data-theme') === 'dark';
        const cs = getComputedStyle(root);
        const cat = (window.ColorPalettes && window.ColorPalettes.getColors('categorical', 10)) || [];
        const primary = (window.ColorPalettes && window.ColorPalettes.getPrimary()) || cat[0] || '#e8956b';
        return {
          dark,
          bg: cs.getPropertyValue('--page-bg').trim() || (dark ? '#0f1115' : '#ffffff'),
          ink: cs.getPropertyValue('--text-color').trim() || (dark ? 'rgba(255,255,255,.9)' : 'rgba(0,0,0,.85)'),
          primary,
          chapters: chapterRamp(cat.length ? cat : d3.schemeTableau10),
        };
      };

      // Reading order as a restrained warm-to-cool ramp between the primary and its complement
      const chapterRamp = (cat) => {
        const n = data ? data.chapters.length : 10;
        const ramp = d3.interpolateHcl(cat[0], cat[Math.floor(cat.length / 2)]);
        return d3.range(n).map((i) => d3.color(ramp(i / Math.max(1, n - 1))).formatHex());
      };

      // Sections in reading order, split at chapter starts and headings
      const sectionsOf = (d) => {
        const cuts = Array.from(new Set([0, ...d.chapters.map((c) => c.start), ...d.headings.map((h) => h.at)]))
          .filter((v) => v < d.total)
          .sort(d3.ascending);
        let sections = cuts.map((start, i) => ({ start, end: i + 1 < cuts.length ? cuts[i + 1] : d.total }));
        const merged = [];
        for (const s of sections) {
          const prev = merged[merged.length - 1];
          if (prev && (s.end - s.start < MIN_SECTION_WORDS || prev.end - prev.start < MIN_SECTION_WORDS)) prev.end = s.end;
          else merged.push({ ...s });
        }
        const chapterAt = (i) => d3.bisectRight(d.chapters.map((c) => c.start), i) - 1;
        return merged.map((s) => ({ ...s, n: s.end - s.start, chapter: chapterAt(s.start) }));
      };

      const build = () => {
        if (!data || !W || !H) return null;
        const sections = sectionsOf(data);
        const lo = -0.55, hi = Math.log10(MAX_LEN) + 0.5;
        const xs = d3.range(SAMPLES).map((j) => lo + (j / (SAMPLES - 1)) * (hi - lo));
        const nMax = d3.max(sections, (s) => s.n);
        const curves = sections.map((s) => {
          const ys = new Float32Array(SAMPLES);
          for (let i = s.start; i < s.end; i++) {
            const v = Math.log10(Math.min(MAX_LEN, parseInt(data.lengths[i], 36) || 1));
            for (let j = 0; j < SAMPLES; j++) {
              const z = (xs[j] - v) / BANDWIDTH;
              if (z > -4 && z < 4) ys[j] += Math.exp(-0.5 * z * z);
            }
          }
          const scale = (0.3 + 0.7 * Math.sqrt(s.n / nMax)) / (d3.max(ys) || 1);
          return ys.map((y) => y * scale);
        });
        const peak = d3.max(curves, (c) => d3.max(c)) || 1;

        const rows = sections.length;
        const padTop = 6, padBottom = 22;
        const lift = 10; // tallest peak, in line spacings
        const spacing = (H - padTop - padBottom) / (rows - 1 + lift);
        const top = H - padBottom - spacing * (rows - 1);
        const lx0 = W * 0.06, lx1 = W * 0.94;
        const amp = spacing * lift;
        const lines = sections.map((s, r) => {
          const base = top + r * spacing;
          const pts = Array.from(curves[r], (y, j) => [lx0 + (j / (SAMPLES - 1)) * (lx1 - lx0), base - (y / peak) * amp]);
          return { ...s, base, pts };
        });
        // Upper envelope of the ridges in front of each line: what hides it
        let front = new Float32Array(SAMPLES).fill(H + 10);
        for (let r = rows - 1; r >= 0; r--) {
          lines[r].env = Array.from(front, (y, j) => [lines[r].pts[j][0], y + 0.6]);
          front = front.map((y, j) => Math.min(y, lines[r].pts[j][1]));
        }
        let t = 0;
        for (const l of lines) { l.t0 = t; t += l.n * MS_PER_WORD; l.t1 = t; }
        const firstOfChapter = new Set(data.chapters.map((c) => lines.findIndex((l) => l.end > c.start)));
        return { rows, lines, spacing, lx0, lx1, loop: t, firstOfChapter };
      };

      const linePath = d3.line().curve(d3.curveBasis).context(ctx);

      const styleOf = () => ({
        stroke: d3.color(theme.ink).copy({ opacity: theme.dark ? 0.86 : 0.8 }).formatRgb(),
        lw: W < 520 ? 0.8 : 1.1,
      });

      // Ridges are painted top to bottom; each one hides what lies behind its curve
      const paintRidge = (c, line, st) => {
        c.beginPath();
        linePath.context(c)(line.pts);
        c.lineTo(model.lx1, line.base + model.spacing * 0.3);
        c.lineTo(model.lx0, line.base + model.spacing * 0.3);
        c.closePath();
        c.fillStyle = theme.bg;
        c.fill();
        c.beginPath();
        linePath(line.pts);
        c.strokeStyle = st.stroke;
        c.lineWidth = st.lw;
        c.stroke();
      };

      const paintLayer = () => {
        const l = document.createElement('canvas');
        l.width = canvas.width;
        l.height = canvas.height;
        const c = l.getContext('2d');
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        c.lineJoin = 'round';
        c.lineCap = 'round';
        const st = styleOf();
        for (const line of model.lines) paintRidge(c, line, st);
        // Chapter starts: a short colored tick in the left margin of their ridge
        c.lineWidth = Math.max(1.4, st.lw * 1.6);
        for (const r of model.firstOfChapter) {
          const line = model.lines[r];
          if (!line) continue;
          c.beginPath();
          c.moveTo(model.lx0 - Math.max(8, W * 0.012) - 6, line.base);
          c.lineTo(model.lx0 - 6, line.base);
          c.strokeStyle = theme.chapters[line.chapter % theme.chapters.length];
          c.stroke();
        }
        linePath.context(ctx);
        return l;
      };

      const draw = (t) => {
        if (!model || !theme || !layer) return;
        const { lines, loop } = model;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(layer, 0, 0);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        // The section being read lights up, then cools down behind the cursor;
        // its stroke is clipped above the ridges in front of it
        const now = t % loop;
        const fade = 2600;
        const accent = d3.color(theme.primary);
        const st = styleOf();
        for (let r = 0; r < lines.length; r++) {
          const line = lines[r];
          let glow = 0;
          if (now >= line.t0 && now < line.t1) glow = Math.min(1, (now - line.t0) / 300);
          else if (now >= line.t1 && now < line.t1 + fade) glow = 1 - (now - line.t1) / fade;
          if (glow <= 0.01) continue;
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(W, -10);
          ctx.lineTo(0, -10);
          ctx.lineTo(0, line.env[0][1]);
          for (const p of line.env) ctx.lineTo(p[0], p[1]);
          ctx.lineTo(W, line.env[line.env.length - 1][1]);
          ctx.closePath();
          ctx.clip();
          ctx.beginPath();
          linePath(line.pts);
          ctx.strokeStyle = accent.copy({ opacity: glow }).formatRgb();
          ctx.lineWidth = st.lw * (1 + 0.7 * glow);
          ctx.stroke();
          ctx.restore();
        }
      };

      const animating = () => visible && !reduceMotion.matches && !document.hidden;
      const frame = (now) => {
        raf = 0;
        clock += Math.min(50, now - (last || now));
        last = now;
        draw(clock);
        if (animating()) raf = requestAnimationFrame(frame);
      };
      const schedule = () => {
        if (raf || !animating()) { if (!raf) draw(clock); return; }
        last = 0;
        raf = requestAnimationFrame(frame);
      };

      const resize = () => {
        const w = root.clientWidth, h = root.clientHeight;
        if (!w || !h) return;
        dpr = Math.min(3, window.devicePixelRatio || 1);
        if (w === W && h === H && canvas.width === Math.round(w * dpr)) return;
        W = w; H = h;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        model = build();
        layer = model && paintLayer();
        draw(clock);
      };
      const retheme = () => {
        theme = readTheme();
        if (model) layer = paintLayer();
        draw(clock);
      };

      ensureD3(async () => {
        try {
          data = await fetchFirstAvailable([`/data/${DATA_FILE}`, `./assets/data/${DATA_FILE}`, `../assets/data/${DATA_FILE}`]);
        } catch (e) {
          root.setAttribute('aria-label', 'Banner data unavailable');
          return;
        }
        theme = readTheme();
        const relayout = () => {
          resize();
          if (!caption || !model) return;
          caption.textContent = `${d3.format(',')(data.total)} words, one ridge per section: how long its words are`;
          caption.style.display = W < 560 ? 'none' : '';
        };
        relayout();
        if (window.ResizeObserver) new ResizeObserver(relayout).observe(root);
        else window.addEventListener('resize', relayout);
        if (window.IntersectionObserver) {
          new IntersectionObserver((entries) => {
            visible = entries.some((e) => e.isIntersecting);
            schedule();
          }).observe(root);
        }
        new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
        document.addEventListener('palettes:updated', retheme);
        document.addEventListener('visibilitychange', schedule);
        if (reduceMotion.addEventListener) reduceMotion.addEventListener('change', schedule);
        schedule();
      });
    };

    const bootstrap = () => document.querySelectorAll(`.${ROOT}:not([data-mounted])`).forEach(mount);
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootstrap, { once: true });
    else bootstrap();
  })();
</script>
