<div class="three-banned-books"></div>
<style>
  .three-banned-books {
    position: relative;
    color: var(--text-color);
    font-family: var(--default-font-family);
    font-size: 14px;
    line-height: 1.45;
  }
  .three-banned-books * { box-sizing: border-box; }
  .three-banned-books .bb3-sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }
  .three-banned-books .bb3-h { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.25; }
  .three-banned-books .bb3-lead { margin: 4px 0 0; font-size: 13px; color: var(--muted-color); max-width: 46em; }

  .three-banned-books .bb3-controls { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin: 14px 0 10px; }
  .three-banned-books .bb3-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .three-banned-books .bb3-label { font-size: 12px; font-weight: 700; margin-right: 2px; }
  .three-banned-books button {
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums;
    padding: 5px 11px; border-radius: 8px; border: 1px solid var(--border-color);
    background: transparent; color: var(--text-color);
  }
  .three-banned-books button:hover { border-color: var(--muted-color); }
  .three-banned-books button[aria-pressed="true"] { background: var(--text-color); border-color: var(--text-color); color: var(--surface-bg); }
  .three-banned-books button:focus-visible,
  .three-banned-books .bb3-stage:focus-visible,
  .three-banned-books a:focus-visible { outline: 2px solid var(--primary-color); outline-offset: 2px; }

  .three-banned-books .bb3-stage {
    position: relative; width: 100%; border-radius: 10px; overflow: hidden; touch-action: pan-y;
    cursor: grab; user-select: none; -webkit-user-select: none;
    background: radial-gradient(110% 85% at 50% 18%, var(--bb3-glow, transparent), transparent 72%);
  }
  .three-banned-books .bb3-stage.is-dragging { cursor: grabbing; }
  .three-banned-books canvas { display: block; width: 100%; }
  .three-banned-books .bb3-labels { position: absolute; inset: 0; pointer-events: none; }
  .three-banned-books .bb3-tag {
    position: absolute; left: 0; top: 0; padding: 3px 7px; border-radius: 6px; white-space: nowrap;
    font-size: 12px; line-height: 1.25; background: var(--bb3-chip, var(--surface-bg)); border: 1px solid var(--border-color);
    will-change: transform; transition: opacity .25s ease;
  }
  .three-banned-books .bb3-tag b { display: block; font-weight: 700; }
  .three-banned-books .bb3-tag span { font-variant-numeric: tabular-nums; color: var(--muted-color); }
  .three-banned-books .bb3-tag::after {
    content: ""; position: absolute; left: var(--lx, 50%); top: 100%; width: 1px; height: var(--lead, 10px);
    background: var(--text-color); opacity: .6;
  }
  .three-banned-books .bb3-tick {
    position: absolute; left: 0; top: 0; font-size: 11px; color: var(--muted-color); white-space: nowrap;
    font-variant-numeric: tabular-nums; will-change: transform;
  }
  .three-banned-books .bb3-hint {
    position: absolute; right: 10px; bottom: 8px; margin: 0; font-size: 11px; color: var(--muted-color); pointer-events: none;
  }

  .three-banned-books .legend { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin: 12px 0 0; }
  .three-banned-books .legend-title { font-size: 12px; font-weight: 700; }
  .three-banned-books .legend .items { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .three-banned-books .legend .item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12px; }
  .three-banned-books .legend .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border-color); }
  .three-banned-books .bb3-note { margin: 8px 0 0; font-size: 12px; color: var(--muted-color); max-width: 52em; }
  .three-banned-books .bb3-source { margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--border-color); font-size: 12px; color: var(--muted-color); }
  .three-banned-books .bb3-source a { color: inherit; text-decoration: underline; text-decoration-color: var(--border-color); text-underline-offset: 2px; }
  .three-banned-books .bb3-fallback { margin: 12px 0 0; font-size: 13px; }
  .three-banned-books .d3-tooltip .tt-m { color: var(--muted-color); }
  .three-banned-books .bb3-error { color: var(--danger-color, #c00); font-size: 12px; white-space: pre-wrap; }
</style>
<script>
  (() => {
    const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    // US tile grid: [column, row] on a 12 x 8 grid, roughly geographic (same as d3-banned-books).
    const TILES = {
      AK: [0, 0], ME: [11, 0],
      WI: [6, 1], VT: [10, 1], NH: [11, 1],
      WA: [1, 2], ID: [2, 2], MT: [3, 2], ND: [4, 2], MN: [5, 2], IL: [6, 2], MI: [7, 2], NY: [9, 2], MA: [10, 2],
      OR: [1, 3], NV: [2, 3], WY: [3, 3], SD: [4, 3], IA: [5, 3], IN: [6, 3], OH: [7, 3], PA: [8, 3], NJ: [9, 3], CT: [10, 3], RI: [11, 3],
      CA: [1, 4], UT: [2, 4], CO: [3, 4], NE: [4, 4], MO: [5, 4], KY: [6, 4], WV: [7, 4], VA: [8, 4], MD: [9, 4], DE: [10, 4],
      AZ: [2, 5], NM: [3, 5], KS: [4, 5], AR: [5, 5], TN: [6, 5], NC: [7, 5], SC: [8, 5], DC: [9, 5],
      OK: [4, 6], LA: [5, 6], MS: [6, 6], AL: [7, 6], GA: [8, 6],
      HI: [0, 7], TX: [4, 7], FL: [8, 7],
    };
    const STATE_NAMES = {
      AL: 'Alabama', AK: 'Alaska', AZ: 'Arizona', AR: 'Arkansas', CA: 'California', CO: 'Colorado', CT: 'Connecticut',
      DE: 'Delaware', DC: 'District of Columbia', FL: 'Florida', GA: 'Georgia', HI: 'Hawaii', ID: 'Idaho', IL: 'Illinois',
      IN: 'Indiana', IA: 'Iowa', KS: 'Kansas', KY: 'Kentucky', LA: 'Louisiana', ME: 'Maine', MD: 'Maryland',
      MA: 'Massachusetts', MI: 'Michigan', MN: 'Minnesota', MS: 'Mississippi', MO: 'Missouri', MT: 'Montana',
      NE: 'Nebraska', NV: 'Nevada', NH: 'New Hampshire', NJ: 'New Jersey', NM: 'New Mexico', NY: 'New York',
      NC: 'North Carolina', ND: 'North Dakota', OH: 'Ohio', OK: 'Oklahoma', OR: 'Oregon', PA: 'Pennsylvania',
      RI: 'Rhode Island', SC: 'South Carolina', SD: 'South Dakota', TN: 'Tennessee', TX: 'Texas', UT: 'Utah',
      VT: 'Vermont', VA: 'Virginia', WA: 'Washington', WV: 'West Virginia', WI: 'Wisconsin', WY: 'Wyoming',
    };
    const STATUS_KEYS = ['removed', 'restricted', 'pending'];
    const STATUS_LABELS = { removed: 'Removed', restricted: 'Restricted', pending: 'Pending investigation' };

    // Scene units: one tile pitch = 1. One book = UNIT bans and BOOK_T units tall, so height is linear in bans.
    const UNIT = 100;
    const BOOK_T = 0.09;
    const GAP = 0.012;
    const MIN_T = 0.014;
    const TILE = 0.9;
    const BASE_H = 0.06;
    const BOOK_W = 0.66;
    const BOOK_D = 0.5;
    const BOOK_Z = -0.08;
    const RULER_STEP = 1000;
    // The ruler stands in the empty cell east of Florida, on the same row as the tallest pile.
    const RULER_X = 3.62;
    const RULER_Z = 3.42;
    const DROP_MS = 340;
    const BOOK_MS = 18;
    const VIEW = { theta: -0.6, phi: 1.02 };
    const CAMERA_DIST = 40;

    const bootstrap = async () => {
      const scriptEl = document.currentScript;
      let container = scriptEl ? scriptEl.previousElementSibling : null;
      if (!(container && container.classList && container.classList.contains('three-banned-books'))) {
        const candidates = Array.from(document.querySelectorAll('.three-banned-books'))
          .filter((el) => !(el.dataset && el.dataset.mounted === 'true'));
        container = candidates[candidates.length - 1] || null;
      }
      if (!container || container.dataset.mounted === 'true') return;
      container.dataset.mounted = 'true';
      container.setAttribute('role', 'region');
      container.setAttribute('aria-label', '3D map of school book bans by US state, 2021 to 2024');

      let mountEl = container;
      while (mountEl && !mountEl.getAttribute?.('data-datafiles') && !mountEl.getAttribute?.('data-config')) mountEl = mountEl.parentElement;
      let providedData = null;
      let providedConfig = null;
      try {
        const attr = mountEl && mountEl.getAttribute('data-datafiles');
        if (attr && attr.trim()) providedData = attr.trim().startsWith('[') ? JSON.parse(attr)[0] : attr.trim();
      } catch (_) {}
      try {
        const cfg = mountEl && mountEl.getAttribute('data-config');
        if (cfg && cfg.trim()) providedConfig = JSON.parse(cfg);
      } catch (_) {}
      const ensureDataPrefix = (p) => (p && !p.includes('/')) ? `/data/${p}` : p;
      const DATA_PATHS = providedData ? [ensureDataPrefix(providedData)] : [
        '/data/banned-books/banned-books.json',
        './assets/data/banned-books/banned-books.json',
        '../assets/data/banned-books/banned-books.json',
      ];

      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const fmt = (n) => Math.round(n).toLocaleString('en-US');
      const pct = (a, b) => `${Math.round((100 * a) / (b || 1))}%`;
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      container.innerHTML = `
        <p class="bb3-h" role="heading" aria-level="3"></p>
        <p class="bb3-lead"></p>
        <div class="bb3-controls">
          <div class="bb3-group bb3-years" role="group" aria-label="School year"><span class="bb3-label">School year</span></div>
          <div class="bb3-group bb3-modes" role="group" aria-label="Color books by"><span class="bb3-label">Color by</span></div>
          <div class="bb3-group">
            <button type="button" class="bb3-play" aria-pressed="false">Play</button>
            <button type="button" class="bb3-reset">Reset view</button>
          </div>
        </div>
        <div class="bb3-stage" tabindex="0" role="img">
          <canvas></canvas>
          <div class="bb3-labels" aria-hidden="true"></div>
          <p class="bb3-hint" aria-hidden="true">Drag to rotate</p>
        </div>
        <div class="legend"><div class="legend-title">Legend</div><div class="items"></div></div>
        <p class="bb3-note"></p>
        <footer class="bb3-source"></footer>
        <p class="bb3-sr bb3-summary"></p>
        <div class="bb3-sr bb3-live" aria-live="polite"></div>
      `;
      const $ = (sel) => container.querySelector(sel);
      const stage = $('.bb3-stage');
      const canvas = $('canvas');
      const labelsEl = $('.bb3-labels');
      const live = $('.bb3-live');

      const tip = document.createElement('div');
      tip.className = 'd3-tooltip';
      Object.assign(tip.style, {
        position: 'absolute', top: '0px', left: '0px', transform: 'translate(-9999px, -9999px)', pointerEvents: 'none',
        padding: '8px 10px', borderRadius: '8px', fontSize: '12px', lineHeight: '1.4', border: '1px solid var(--border-color)',
        background: 'var(--surface-bg)', color: 'var(--text-color)', boxShadow: '0 4px 24px rgba(0,0,0,.18)', opacity: '0',
        transition: 'opacity .12s ease', zIndex: '5', maxWidth: '240px',
      });
      stage.appendChild(tip);
      const showTip = (html, x, y) => {
        tip.innerHTML = html;
        const w = tip.offsetWidth || 200;
        const h = tip.offsetHeight || 80;
        const left = Math.max(4, Math.min(stage.clientWidth - w - 4, x + 14));
        const top = Math.max(4, Math.min(stage.clientHeight - h - 4, y + 14));
        tip.style.transform = `translate(${Math.round(left)}px, ${Math.round(top)}px)`;
        tip.style.opacity = '1';
      };
      const hideTip = () => { tip.style.opacity = '0'; tip.style.transform = 'translate(-9999px, -9999px)'; };

      const fail = (msg) => {
        const pre = document.createElement('pre');
        pre.className = 'bb3-error';
        pre.textContent = `Banned books 3D: ${msg}`;
        container.appendChild(pre);
      };

      let data;
      try {
        data = await (async () => {
          for (const p of DATA_PATHS) {
            try { const r = await fetch(p, { cache: 'no-cache' }); if (r.ok) return await r.json(); } catch (_) {}
          }
          throw new Error(`data not found (${DATA_PATHS.join(', ')})`);
        })();
      } catch (e) { fail(e.message); return; }

      const YEARS = data.years;
      const SCOPES = [...YEARS, 'all'];
      let scope = providedConfig && SCOPES.includes(providedConfig.year) ? providedConfig.year : 'all';
      let mode = 'status';

      // Counts per state for a scope, split by status or by school year (bottom to top).
      const countsFor = (abbr, sc, md) => {
        const s = data.states[abbr];
        if (!s) return [];
        const years = sc === 'all' ? YEARS : [sc];
        if (md === 'year') return YEARS.map((y) => ({ key: y, n: years.includes(y) ? s.byYear[y] : 0 }));
        return STATUS_KEYS.map((k) => ({ key: k, n: years.reduce((t, y) => t + s.status[y][k], 0) }));
      };
      const totalFor = (abbr, sc) => countsFor(abbr, sc, 'status').reduce((t, d) => t + d.n, 0);
      const ranking = (sc) => Object.keys(TILES).map((k) => ({ k, n: totalFor(k, sc) })).filter((d) => d.n > 0).sort((a, b) => b.n - a.n);
      const scopeBans = (sc) => data.summary[sc].bans;

      // Text parts that do not need WebGL
      const yearButtons = SCOPES.map((k) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.scope = k;
        b.textContent = k === 'all' ? 'All years' : k;
        $('.bb3-years').appendChild(b);
        return b;
      });
      const modeButtons = [['status', 'Ban status'], ['year', 'School year']].map(([k, l]) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.mode = k;
        b.textContent = l;
        $('.bb3-modes').appendChild(b);
        return b;
      });
      const src = data.meta.sources.map((s) => `<a href="${s.sheet}" target="_blank" rel="noopener">${s.year}</a>`).join(', ');
      $('.bb3-source').innerHTML = `<b>Source:</b> PEN America, <a href="https://pen.org/book-bans/pen-america-book-ban-index-data/" target="_blank" rel="noopener">Index of School Book Bans</a>, school years ${src} (retrieved ${data.meta.retrieved}). One ban is one title removed or restricted in one US public school district; the index is not exhaustive and the 2024-25 school year is not included.`;
      $('.bb3-note').textContent = `Heights are proportional to bans: one book stands for ${UNIT} bans and the top book of a pile is thinner when the count is not a round hundred. The ruler next to Florida marks every ${fmt(RULER_STEP)} bans and keeps the same scale for every school year. Piles of only a few bans keep a minimum thickness so they stay visible.`;

      const updateText = () => {
        const r = ranking(scope);
        const total = scopeBans(scope);
        const [a, b] = r;
        const when = scope === 'all' ? 'July 2021 to June 2024' : `the ${scope} school year`;
        $('.bb3-h').textContent = `${STATE_NAMES[a.k]} and ${STATE_NAMES[b.k]} tower over the rest: ${pct(a.n + b.n, total)} of ${scope === 'all' ? 'all' : scope} bans`;
        $('.bb3-lead').textContent = `${fmt(total)} school book bans recorded by PEN America in ${r.length} states, ${when}. Each book in a pile is ${UNIT} bans.`;
        const top = r.slice(0, 8).map((d) => `${STATE_NAMES[d.k]} ${fmt(d.n)}`).join(', ');
        $('.bb3-summary').textContent = `${fmt(total)} school book bans in ${when}. States from most to fewest bans: ${top}${r.length > 8 ? `, and ${r.length - 8} more states` : ''}.`;
        stage.setAttribute('aria-label', `3D tile map of US states where each state is a pile of books, one book per ${UNIT} bans, ${when}. Tallest piles: ${r.slice(0, 3).map((d) => `${STATE_NAMES[d.k]} ${fmt(d.n)}`).join(', ')}. Arrow keys step through states from most to fewest bans; Shift and arrow keys rotate the view.`);
        yearButtons.forEach((btn) => btn.setAttribute('aria-pressed', String(btn.dataset.scope === scope)));
        modeButtons.forEach((btn) => btn.setAttribute('aria-pressed', String(btn.dataset.mode === mode)));
      };
      updateText();

      let THREE;
      try { THREE = await import(THREE_URL); } catch (e) { fail(`could not load three.js (${e.message})`); return; }
      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
      } catch (e) {
        fail('WebGL is not available in this browser. The text summary below lists the same numbers.');
        $('.bb3-summary').classList.remove('bb3-sr');
        $('.bb3-summary').classList.add('bb3-fallback');
        return;
      }
      renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      renderer.setClearColor(0x000000, 0);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      // Orthographic on purpose: the same number of bans has the same height on screen anywhere on the map.
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);
      const target = new THREE.Vector3(0, 0, 0);

      // Lights: soft studio key with shadows, sky fill and a faint rim.
      const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8178, 1.5);
      scene.add(hemi);
      const key = new THREE.DirectionalLight(0xffffff, 2.4);
      key.position.set(-7, 14, 9);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      Object.assign(key.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 50 });
      key.shadow.bias = -0.0004;
      key.shadow.normalBias = 0.02;
      key.shadow.radius = 4;
      scene.add(key);
      scene.add(key.target);
      const rim = new THREE.DirectionalLight(0xffffff, 0.5);
      rim.position.set(6, 6, -10);
      scene.add(rim);

      const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.16 }));
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const tilePos = (abbr) => {
        const [c, r] = TILES[abbr];
        return { x: (c - 5.5), z: (r - 3.5) };
      };
      const abbrs = Object.keys(TILES);

      // Base tiles
      const baseMat = new THREE.MeshStandardMaterial({ roughness: 0.9, metalness: 0 });
      const base = new THREE.InstancedMesh(new THREE.BoxGeometry(TILE, BASE_H, TILE), baseMat, abbrs.length);
      base.receiveShadow = true;
      const m4 = new THREE.Matrix4();
      const q = new THREE.Quaternion();
      const v3 = new THREE.Vector3();
      const s3 = new THREE.Vector3();
      const up = new THREE.Vector3(0, 1, 0);
      abbrs.forEach((k, i) => {
        const p = tilePos(k);
        base.setMatrixAt(i, m4.makeTranslation(p.x, BASE_H / 2, p.z));
        base.setColorAt(i, new THREE.Color(0xffffff));
      });
      scene.add(base);

      // State abbreviations painted on one transparent plane over the tiles
      const PX = 128;
      const abbrCanvas = document.createElement('canvas');
      abbrCanvas.width = 12 * PX;
      abbrCanvas.height = 8 * PX;
      const abbrTex = new THREE.CanvasTexture(abbrCanvas);
      abbrTex.colorSpace = THREE.SRGBColorSpace;
      abbrTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const abbrPlane = new THREE.Mesh(new THREE.PlaneGeometry(12, 8), new THREE.MeshBasicMaterial({ map: abbrTex, transparent: true, depthWrite: false }));
      abbrPlane.rotation.x = -Math.PI / 2;
      abbrPlane.position.set(0, BASE_H + 0.002, 0);
      scene.add(abbrPlane);

      // Books: a cover box and a slightly protruding page block share one instance matrix.
      const coverGeo = new THREE.BoxGeometry(1, 1, 1);
      // Pages show on the fore-edge only (east side), so the cover color carries the encoding.
      const pagesGeo = new THREE.BoxGeometry(1, 0.62, 0.94).translate(0.014, 0, 0);
      const coverMat = new THREE.MeshStandardMaterial({ roughness: 0.62, metalness: 0 });
      const pagesMat = new THREE.MeshStandardMaterial({ roughness: 0.95, metalness: 0 });

      const rand = (seed) => () => {
        seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      const hash = (s) => [...s].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261);

      // One entry per book, bottom to top within each pile.
      const layout = (sc, md) => {
        const books = [];
        const tops = {};
        abbrs.forEach((k) => {
          const parts = countsFor(k, sc, md);
          const rnd = rand(hash(k));
          const p = tilePos(k);
          let y = BASE_H;
          let idx = 0;
          parts.forEach((part) => {
            let left = part.n;
            while (left > 0) {
              const n = Math.min(UNIT, left);
              left -= n;
              const h = Math.max((n / UNIT) * BOOK_T, MIN_T + GAP);
              books.push({
                k, key: part.key, n, idx: idx++, y0: y, h: h - GAP,
                x: p.x + (rnd() - 0.5) * 0.05, z: p.z + BOOK_Z + (rnd() - 0.5) * 0.04,
                yaw: (rnd() - 0.5) * 0.2, sx: 1 + (rnd() - 0.5) * 0.08, sz: 1 + (rnd() - 0.5) * 0.1,
              });
              y += h;
            }
          });
          tops[k] = y;
        });
        return { books, tops };
      };
      let maxBooks = 0;
      let maxTop = 0;
      const stateTop = {};
      SCOPES.forEach((sc) => ['status', 'year'].forEach((md) => {
        const L = layout(sc, md);
        maxBooks = Math.max(maxBooks, L.books.length);
        Object.entries(L.tops).forEach(([k, t]) => { stateTop[k] = Math.max(stateTop[k] || 0, t); maxTop = Math.max(maxTop, t); });
      }));
      const covers = new THREE.InstancedMesh(coverGeo, coverMat, maxBooks);
      const pages = new THREE.InstancedMesh(pagesGeo, pagesMat, maxBooks);
      [covers, pages].forEach((mesh) => {
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.frustumCulled = false;
        mesh.count = 0;
        scene.add(mesh);
      });
      for (let i = 0; i < maxBooks; i++) covers.setColorAt(i, new THREE.Color(0xffffff));

      // Ruler: a thin post with a tick every RULER_STEP bans, at the depth of the front row.
      const maxAll = Math.max(...abbrs.map((k) => totalFor(k, 'all')));
      const rulerSteps = Math.ceil(maxAll / RULER_STEP);
      const rulerH = (rulerSteps * RULER_STEP / UNIT) * BOOK_T;
      const rulerMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.55 });
      const ruler = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), rulerMat, rulerSteps + 2);
      ruler.setMatrixAt(0, m4.compose(v3.set(RULER_X, BASE_H + rulerH / 2, RULER_Z), q.identity(), s3.set(0.022, rulerH, 0.022)));
      ruler.setMatrixAt(1, m4.compose(v3.set(RULER_X, BASE_H / 2, RULER_Z), q.identity(), s3.set(0.36, BASE_H, 0.36)));
      for (let i = 1; i <= rulerSteps; i++) {
        const y = BASE_H + (i * RULER_STEP / UNIT) * BOOK_T;
        ruler.setMatrixAt(i + 1, m4.compose(v3.set(RULER_X, y, RULER_Z), q.identity(), s3.set(0.22, 0.012, 0.022)));
      }
      scene.add(ruler);
      const rulerTicks = [];
      for (let i = 1; i <= rulerSteps; i++) {
        const el = document.createElement('span');
        el.className = 'bb3-tick';
        el.textContent = i === rulerSteps ? `${fmt(i * RULER_STEP)} bans` : fmt(i * RULER_STEP);
        labelsEl.appendChild(el);
        rulerTicks.push({ el, pos: new THREE.Vector3(RULER_X + 0.14, BASE_H + (i * RULER_STEP / UNIT) * BOOK_T, RULER_Z) });
      }

      // Colors from the theme
      let C = {};
      const probe = document.createElement('span');
      probe.style.display = 'none';
      container.appendChild(probe);
      const cssColor = (name, fallback) => {
        probe.style.color = fallback;
        probe.style.color = `var(${name}, ${fallback})`;
        const m = (getComputedStyle(probe).color || '').match(/[\d.]+/g);
        if (!m || m.length < 3) return { r: 0, g: 0, b: 0, a: 1 };
        return { r: +m[0] / 255, g: +m[1] / 255, b: +m[2] / 255, a: m.length > 3 ? +m[3] : 1 };
      };
      const toColor = (c, over) => {
        const a = c.a == null ? 1 : c.a;
        const o = over || { r: 1, g: 1, b: 1 };
        const col = new THREE.Color();
        col.setRGB(c.r * a + o.r * (1 - a), c.g * a + o.g * (1 - a), c.b * a + o.b * (1 - a), THREE.SRGBColorSpace);
        return col;
      };
      const readTheme = () => {
        const themed = container.closest('[data-theme]');
        const isDark = (themed ? themed.getAttribute('data-theme') : '') === 'dark';
        const P = window.ColorPalettes;
        const bgRaw = cssColor('--surface-bg', isDark ? '#07080a' : '#f9f9f9');
        const bg = toColor(bgRaw);
        const text = toColor(cssColor('--text-color', isDark ? 'rgba(255,255,255,.9)' : 'rgba(0,0,0,.85)'), bgRaw);
        const primaryHex = (P && P.getPrimary && P.getPrimary()) || '#e38a42';
        const primary = new THREE.Color(primaryHex);
        let seq = (P && P.getColors && P.getColors('sequential', 6)) || [];
        seq = seq.length === 6 ? seq.map((h) => new THREE.Color(h))
          : [0.55, 0.65, 0.75, 0.82, 0.9, 1].map((t) => bg.clone().lerp(primary, t)).reverse();
        // The palette runs dark to light; the strongest category must contrast most with the background.
        if (!isDark) seq.reverse();
        const neutral = (t) => bg.clone().lerp(text, t);
        C = {
          isDark, bg, text, primary, neutral,
          status: { removed: seq[5], restricted: seq[3], pending: seq[1] },
          year: Object.fromEntries(YEARS.map((y, i) => [y, seq[[1, 3, 5][i] ?? 5]])),
          paper: isDark ? neutral(0.78).lerp(primary, 0.06) : new THREE.Color(0xffffff).lerp(primary, 0.05),
          tile: neutral(isDark ? 0.12 : 0.085),
          tileEmpty: neutral(isDark ? 0.06 : 0.04),
          mutedCss: isDark ? 'rgba(255,255,255,.62)' : 'rgba(0,0,0,.5)',
        };
        container.style.setProperty('--bb3-glow', `#${neutral(isDark ? 0.07 : -0.6).getHexString(THREE.SRGBColorSpace)}`);
        container.style.setProperty('--bb3-chip', `#${bg.getHexString(THREE.SRGBColorSpace)}e6`);
      };
      const applyTheme = () => {
        readTheme();
        pagesMat.color.copy(C.paper);
        rulerMat.color.copy(C.text);
        ground.material.opacity = C.isDark ? 0.5 : 0.16;
        hemi.intensity = C.isDark ? 1.1 : 1.5;
        hemi.groundColor.copy(C.isDark ? C.neutral(0.1) : new THREE.Color(0x8a8178));
        key.intensity = C.isDark ? 2.0 : 2.4;
        rim.intensity = C.isDark ? 0.9 : 0.4;
        abbrs.forEach((k, i) => base.setColorAt(i, data.states[k] ? C.tile : C.tileEmpty));
        base.instanceColor.needsUpdate = true;
        const ctx = abbrCanvas.getContext('2d');
        ctx.clearRect(0, 0, abbrCanvas.width, abbrCanvas.height);
        ctx.font = `700 ${Math.round(PX * 0.2)}px "Source Sans Pro", system-ui, sans-serif`;
        ctx.textBaseline = 'alphabetic';
        abbrs.forEach((k) => {
          const [c, r] = TILES[k];
          ctx.fillStyle = C.mutedCss;
          ctx.fillText(k, c * PX + PX * 0.1, r * PX + PX * 0.9);
        });
        abbrTex.needsUpdate = true;
        paintBooks();
      };

      // Book placement and drop-in animation
      let current = { books: [], tops: {} };
      let animStart = 0;
      let animating = false;
      let hovered = null;
      const bookColor = (b) => (mode === 'year' ? C.year[b.key] : C.status[b.key]);
      const paintBooks = () => {
        const hot = new THREE.Color();
        current.books.forEach((b, i) => {
          const c = bookColor(b);
          covers.setColorAt(i, b.k === hovered ? hot.copy(c).lerp(C.isDark ? new THREE.Color(0xffffff) : C.text, 0.28) : c);
        });
        if (covers.instanceColor) covers.instanceColor.needsUpdate = true;
        if (base.instanceColor) {
          abbrs.forEach((k, i) => base.setColorAt(i, k === hovered ? C.neutral(C.isDark ? 0.3 : 0.22) : (data.states[k] ? C.tile : C.tileEmpty)));
          base.instanceColor.needsUpdate = true;
        }
      };
      const easeOut = (t) => 1 - Math.pow(1 - t, 3);
      const placeBooks = (now) => {
        let done = true;
        current.books.forEach((b, i) => {
          let drop = 0;
          let scale = 1;
          if (animating) {
            const t = (now - animStart - b.idx * BOOK_MS) / DROP_MS;
            if (t < 1) done = false;
            if (t <= 0) scale = 0;
            else if (t < 1) drop = (1 - easeOut(t)) * 1.1;
          }
          q.setFromAxisAngle(up, b.yaw);
          v3.set(b.x, b.y0 + b.h / 2 + drop, b.z);
          s3.set(BOOK_W * b.sx * scale, b.h * scale, BOOK_D * b.sz * scale);
          m4.compose(v3, q, s3);
          covers.setMatrixAt(i, m4);
          pages.setMatrixAt(i, m4);
        });
        covers.instanceMatrix.needsUpdate = true;
        pages.instanceMatrix.needsUpdate = true;
        if (animating && done) {
          animating = false;
          covers.computeBoundingSphere();
        }
      };
      const setLayout = (animate) => {
        current = layout(scope, mode);
        covers.count = current.books.length;
        pages.count = current.books.length;
        animating = animate && !reduceMotion;
        animStart = performance.now();
        paintBooks();
        placeBooks(animStart);
        if (!animating) covers.computeBoundingSphere();
        updateText();
        updateLegend();
        buildTags();
        kick();
      };
      const updateLegend = () => {
        const items = mode === 'year'
          ? YEARS.map((y) => [C.year[y], y])
          : STATUS_KEYS.filter((k) => abbrs.some((a) => countsFor(a, scope, 'status').find((d) => d.key === k && d.n > 0)))
            .map((k) => [C.status[k], STATUS_LABELS[k]]);
        $('.legend .items').innerHTML = items.map(([c, l]) => `<span class="item"><span class="swatch" style="background:#${c.getHexString(THREE.SRGBColorSpace)}"></span><span>${l}</span></span>`).join('')
          + `<span class="item"><span class="swatch" style="background:#${C.paper.getHexString(THREE.SRGBColorSpace)}"></span><span>1 book = ${UNIT} bans</span></span>`;
      };

      // Direct labels on the three tallest piles
      let tags = [];
      const buildTags = () => {
        tags.forEach((t) => t.el.remove());
        tags = ranking(scope).slice(0, 3).map((d) => {
          const el = document.createElement('div');
          el.className = 'bb3-tag';
          el.innerHTML = `<b>${esc(STATE_NAMES[d.k])}</b><span>${fmt(d.n)} bans</span>`;
          labelsEl.appendChild(el);
          const p = tilePos(d.k);
          return { el, k: d.k, w: 0, h: 0, pos: new THREE.Vector3(p.x, current.tops[d.k] + 0.05, p.z + BOOK_Z) };
        });
      };
      const project = (p, W, H) => {
        v3.copy(p).project(camera);
        return { x: (v3.x * 0.5 + 0.5) * W, y: (-v3.y * 0.5 + 0.5) * H, z: v3.z };
      };
      const hits = (p, b, pad) => p.x0 < b.x1 + pad && p.x1 > b.x0 - pad && p.y0 < b.y1 + pad && p.y1 > b.y0 - pad;
      const placeTags = (W, H) => {
        const ticks = rulerTicks.map((t) => {
          const a = project(t.pos, W, H);
          if (!t.w) t.w = t.el.offsetWidth || 40;
          t.el.style.transform = `translate(${Math.round(a.x + 4)}px, ${Math.round(a.y - 7)}px)`;
          return { x0: a.x - 6, x1: a.x + 4 + t.w, y0: a.y - 8, y1: a.y + 8 };
        });
        const boxes = [];
        tags.forEach((t) => {
          if (!t.w) { t.w = t.el.offsetWidth; t.h = t.el.offsetHeight; }
          const a = project(t.pos, W, H);
          let lead = 10;
          let box = { x0: a.x - t.w / 2, x1: a.x + t.w / 2, y1: a.y - lead, y0: a.y - lead - t.h };
          // Slide left of the ruler labels, then stack above earlier labels.
          const blocking = ticks.filter((b) => hits(box, b, 3));
          if (blocking.length) {
            const dx = box.x1 - (Math.min(...blocking.map((b) => b.x0)) - 6);
            box = { ...box, x0: box.x0 - dx, x1: box.x1 - dx };
          }
          boxes.forEach((b) => {
            if (hits(box, b, 4)) {
              const dy = box.y1 - (b.y0 - 4);
              box = { ...box, y0: box.y0 - dy, y1: box.y1 - dy };
              lead += dy;
            }
          });
          boxes.push(box);
          t.el.style.opacity = animating ? '0' : '1';
          t.el.style.setProperty('--lead', `${Math.round(lead)}px`);
          t.el.style.setProperty('--lx', `${Math.round(Math.max(4, Math.min(t.w - 4, a.x - box.x0)))}px`);
          t.el.style.transform = `translate(${Math.round(box.x0)}px, ${Math.round(box.y0)}px)`;
        });
      };

      // Camera: orbit around a fixed target; the frame is fitted to the content seen from the current angle
      // and uses the tallest pile of any year, so every school year shares one scale.
      const view = { ...VIEW };
      let driftT = 0;
      let lastInput = performance.now();
      // Fit on what can actually be drawn: the tile grid, every pile at its tallest and the ruler.
      const corners = [];
      [-6, 6].forEach((x) => [-4, 4].forEach((z) => corners.push(new THREE.Vector3(x, 0, z))));
      abbrs.forEach((k) => { const p = tilePos(k); corners.push(new THREE.Vector3(p.x, (stateTop[k] || BASE_H) + 0.35, p.z)); });
      corners.push(new THREE.Vector3(RULER_X + 1.1, BASE_H + rulerH + 0.2, RULER_Z));
      target.set(0, maxTop * 0.22, 0.4);
      const placeCamera = (theta, phi, d) => {
        camera.position.set(
          target.x + d * Math.sin(phi) * Math.sin(theta),
          target.y + d * Math.cos(phi),
          target.z + d * Math.sin(phi) * Math.cos(theta),
        );
        camera.lookAt(target);
        camera.updateMatrixWorld();
      };
      const frame3 = { l: -1, r: 1, t: 1, b: -1, ready: false };
      const fitFrame = (snap) => {
        const inv = camera.matrixWorldInverse;
        let x0 = Infinity; let x1 = -Infinity; let y0 = Infinity; let y1 = -Infinity;
        corners.forEach((c) => {
          v3.copy(c).applyMatrix4(inv);
          x0 = Math.min(x0, v3.x); x1 = Math.max(x1, v3.x); y0 = Math.min(y0, v3.y); y1 = Math.max(y1, v3.y);
        });
        const u = Math.max((x1 - x0) / (width * 0.9), (y1 - y0) / (height * 0.8));
        const cx = (x0 + x1) / 2;
        const cy = (y0 + y1) / 2 + height * 0.035 * u;
        const goal = { l: cx - (width * u) / 2, r: cx + (width * u) / 2, t: cy + (height * u) / 2, b: cy - (height * u) / 2 };
        const k = snap || !frame3.ready ? 1 : 0.14;
        let moving = false;
        ['l', 'r', 't', 'b'].forEach((s) => {
          const d = goal[s] - frame3[s];
          if (Math.abs(d) > 1e-3) moving = true;
          frame3[s] += d * k;
        });
        frame3.ready = true;
        Object.assign(camera, { left: frame3.l, right: frame3.r, top: frame3.t, bottom: frame3.b });
        camera.updateProjectionMatrix();
        return moving && k < 1;
      };

      let width = 0;
      let height = 0;
      const resize = () => {
        const w = stage.clientWidth || 600;
        const h = Math.round(Math.max(340, Math.min(640, w * 0.62)));
        if (w === width && h === height) return;
        width = w;
        height = h;
        renderer.setSize(w, h, false);
        canvas.style.height = `${h}px`;
        placeCamera(shownTheta(), view.phi, CAMERA_DIST);
        fitFrame(true);
        kick();
      };

      // Render loop runs only while visible and something moves.
      let visible = true;
      let raf = 0;
      let dragging = null;
      const drifting = () => !reduceMotion && !dragging && performance.now() - lastInput > 2500;
      const shownTheta = () => view.theta + (reduceMotion ? 0 : Math.sin(driftT * 0.22) * 0.12);
      const frame = (now) => {
        raf = 0;
        if (!visible || document.hidden) return;
        if (drifting()) driftT += 1 / 60;
        placeCamera(shownTheta(), view.phi, CAMERA_DIST);
        const fitting = fitFrame(reduceMotion);
        if (animating) placeBooks(now);
        renderer.render(scene, camera);
        placeTags(width, height);
        if (animating || fitting || drifting() || dragging) raf = requestAnimationFrame(frame);
      };
      const kick = () => { if (!raf && visible && !document.hidden) raf = requestAnimationFrame(frame); };
      const touch = () => { lastInput = performance.now(); kick(); setTimeout(kick, 2600); };

      // Picking
      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      const pick = (x, y) => {
        ndc.set((x / width) * 2 - 1, -(y / height) * 2 + 1);
        raycaster.setFromCamera(ndc, camera);
        const hit = raycaster.intersectObjects([covers, base], false)[0];
        if (!hit || hit.instanceId == null) return null;
        return hit.object === covers ? current.books[hit.instanceId]?.k : abbrs[hit.instanceId];
      };
      const tipHtml = (k) => {
        const name = STATE_NAMES[k];
        const n = totalFor(k, scope);
        if (!n) return `<b>${esc(name)}</b><br><span class="tt-m">No bans recorded ${scope === 'all' ? '' : `in ${scope}`}</span>`;
        const r = ranking(scope);
        const rank = r.findIndex((d) => d.k === k) + 1;
        const parts = countsFor(k, scope, mode).filter((d) => d.n > 0)
          .map((d) => `${mode === 'year' ? d.key : STATUS_LABELS[d.key]}: ${fmt(d.n)}`).join('<br>');
        return `<b>${esc(name)}</b> <span class="tt-m">(#${rank} of ${r.length})</span><br>${fmt(n)} bans ${scope === 'all' ? '2021-24' : `in ${scope}`}, ${pct(n, scopeBans(scope))} of the total<br><span class="tt-m">${parts}</span>`;
      };
      const setHover = (k) => {
        if (k === hovered) return;
        hovered = k;
        paintBooks();
        kick();
      };

      stage.addEventListener('pointerdown', (e) => {
        dragging = { x: e.clientX, y: e.clientY, theta: view.theta, phi: view.phi, type: e.pointerType, moved: false };
        stage.setPointerCapture(e.pointerId);
        stage.classList.add('is-dragging');
        touch();
      });
      stage.addEventListener('pointermove', (e) => {
        const r = stage.getBoundingClientRect();
        const x = e.clientX - r.left;
        const y = e.clientY - r.top;
        if (dragging) {
          const dx = e.clientX - dragging.x;
          const dy = e.clientY - dragging.y;
          if (Math.abs(dx) + Math.abs(dy) > 3) dragging.moved = true;
          view.theta = dragging.theta - dx * 0.008;
          if (dragging.type === 'mouse') view.phi = Math.max(0.55, Math.min(1.36, dragging.phi - dy * 0.006));
          hideTip();
          touch();
          return;
        }
        const k = pick(x, y);
        setHover(k);
        if (k) showTip(tipHtml(k), x, y); else hideTip();
      });
      const endDrag = (e) => {
        if (!dragging) return;
        const tapped = !dragging.moved && dragging.type !== 'mouse';
        dragging = null;
        if (tapped) {
          const r = stage.getBoundingClientRect();
          const x = e.clientX - r.left;
          const y = e.clientY - r.top;
          const k = pick(x, y);
          setHover(k);
          if (k) showTip(tipHtml(k), x, y); else hideTip();
        }
        stage.classList.remove('is-dragging');
        try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
        touch();
      };
      stage.addEventListener('pointerup', endDrag);
      stage.addEventListener('pointercancel', endDrag);
      stage.addEventListener('pointerleave', () => { if (!dragging) { setHover(null); hideTip(); } });

      // Keyboard: arrows step through states by rank, Shift + arrows rotate.
      let keyIndex = -1;
      stage.addEventListener('keydown', (e) => {
        const r = ranking(scope);
        if (e.shiftKey && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
          if (e.key === 'ArrowLeft') view.theta += 0.12;
          if (e.key === 'ArrowRight') view.theta -= 0.12;
          if (e.key === 'ArrowUp') view.phi = Math.max(0.55, view.phi - 0.08);
          if (e.key === 'ArrowDown') view.phi = Math.min(1.36, view.phi + 0.08);
          e.preventDefault();
          touch();
          return;
        }
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') keyIndex = (keyIndex + 1) % r.length;
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') keyIndex = (keyIndex - 1 + r.length) % r.length;
        else if (e.key === 'Home') keyIndex = 0;
        else if (e.key === 'End') keyIndex = r.length - 1;
        else if (e.key === 'Escape') { keyIndex = -1; setHover(null); hideTip(); return; }
        else return;
        e.preventDefault();
        const k = r[keyIndex].k;
        setHover(k);
        lastInput = performance.now();
        placeCamera(shownTheta(), view.phi, CAMERA_DIST);
        const p = tilePos(k);
        const a = project(new THREE.Vector3(p.x, current.tops[k], p.z), width, height);
        const html = tipHtml(k);
        showTip(html, a.x, a.y);
        live.textContent = html.replace(/<br\s*\/?>/g, '. ').replace(/<[^>]+>/g, '');
      });
      stage.addEventListener('blur', () => { keyIndex = -1; setHover(null); hideTip(); });

      // Controls
      let playTimer = 0;
      const stopPlay = () => {
        clearTimeout(playTimer);
        playTimer = 0;
        $('.bb3-play').setAttribute('aria-pressed', 'false');
        $('.bb3-play').textContent = 'Play';
      };
      const setScope = (sc, fromPlay) => {
        if (!fromPlay) stopPlay();
        scope = sc;
        if (mode === 'year' && sc !== 'all') mode = 'status';
        hideTip();
        setLayout(true);
      };
      yearButtons.forEach((b) => b.addEventListener('click', () => setScope(b.dataset.scope)));
      modeButtons.forEach((b) => b.addEventListener('click', () => {
        stopPlay();
        mode = b.dataset.mode;
        if (mode === 'year') scope = 'all';
        setLayout(true);
      }));
      $('.bb3-play').addEventListener('click', () => {
        if (playTimer) { stopPlay(); return; }
        $('.bb3-play').setAttribute('aria-pressed', 'true');
        $('.bb3-play').textContent = 'Pause';
        let i = 0;
        const step = () => {
          setScope(SCOPES[i], true);
          const books = Math.max(...Object.values(current.tops).map((t) => t / BOOK_T));
          i += 1;
          if (i < SCOPES.length) playTimer = setTimeout(step, (reduceMotion ? 0 : books * BOOK_MS + DROP_MS) + 1600);
          else { playTimer = 0; stopPlay(); }
        };
        step();
      });
      $('.bb3-reset').addEventListener('click', () => {
        view.theta = VIEW.theta;
        view.phi = VIEW.phi;
        driftT = 0;
        touch();
      });

      applyTheme();
      resize();
      setLayout(true);
      touch();

      if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
      else window.addEventListener('resize', resize);
      if (window.IntersectionObserver) {
        new IntersectionObserver((entries) => {
          visible = entries.some((e) => e.isIntersecting);
          if (visible) kick();
        }).observe(stage);
      }
      document.addEventListener('visibilitychange', () => { if (!document.hidden) kick(); });
      const retheme = () => { applyTheme(); updateLegend(); kick(); };
      new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      document.addEventListener('palettes:updated', retheme);
    };

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootstrap, { once: true });
    else bootstrap();
  })();
</script>
